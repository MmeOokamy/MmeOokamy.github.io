<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Mme Ookamy — Python developer · Web · Homelab">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ff8500" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.85" cy="0" r="0.7">
      <stop offset="0" stop-color="#ff8500" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ff8500" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#ff8500"/>
      <stop offset="1" stop-color="#ff8500" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="1200" height="260" fill="#0a0c0f"/>
  <rect width="1200" height="260" fill="url(#grid)"/>
  <rect width="1200" height="260" fill="url(#glow)"/>

  <!-- Holographic rings -->
  <g transform="translate(1030 130)" fill="none" stroke="#ff8500">
    <circle r="92" stroke-opacity="0.18" stroke-dasharray="4 8"/>
    <path d="M0 -110 A110 110 0 0 1 110 0" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
    </path>
    <path d="M0 74 A74 74 0 0 1 -74 0" stroke-width="2" stroke-opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="20s" repeatCount="indefinite"/>
    </path>
    <circle r="54" stroke-opacity="0.35"/>
    <text y="10" text-anchor="middle" fill="#ff8500" stroke="none" font-family="Consolas, Menlo, monospace" font-size="30" font-weight="700">&gt;_</text>
  </g>

  <!-- Corner plate -->
  <path d="M60 40h220l-12 18H60z" fill="#ff8500" fill-opacity="0.12" stroke="#ff8500" stroke-opacity="0.5"/>
  <text x="72" y="54" fill="#ff8500" font-family="Consolas, Menlo, monospace" font-size="12" letter-spacing="2.5">// PERSONNEL FILE</text>

  <text x="58" y="138" xml:space="preserve" fill="#ff8500" font-family="Eurostile, 'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="900" letter-spacing="6" filter="url(#blur)" opacity="0.55">MME OOKAMY</text>
  <text x="58" y="138" xml:space="preserve" font-family="Eurostile, 'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="900" letter-spacing="6"><tspan fill="#ebe4d8">MME </tspan><tspan fill="#ff8500">OOKAMY</tspan></text>

  <rect x="60" y="160" width="560" height="2" fill="url(#line)"/>
  <text x="60" y="196" fill="#ffb347" font-family="Consolas, Menlo, monospace" font-size="22">Python developer · Web · Homelab</text>
  <text x="60" y="226" fill="#a39b8e" font-family="Consolas, Menlo, monospace" font-size="15">FastAPI · Vue 3 · Proxmox · PyGame</text>
</svg>
